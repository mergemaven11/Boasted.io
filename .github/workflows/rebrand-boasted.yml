name: One-time Boasted rebrand

on:
  push:
    branches:
      - rebrand/boasted-io
    paths:
      - .github/workflows/rebrand-boasted.yml

permissions:
  contents: write

jobs:
  rebrand:
    if: ${{ !contains(github.event.head_commit.message, '[boasted-rebrand]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand/boasted-io
          fetch-depth: 0

      - name: Rebrand customer-facing text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          text_exts = {
              '.css', '.csv', '.html', '.js', '.jsx', '.json', '.md', '.mjs', '.py',
              '.rst', '.scss', '.svg', '.toml', '.ts', '.tsx', '.txt', '.xml', '.yaml', '.yml'
          }
          exact_names = {'.env.example', 'Dockerfile', 'LICENSE', 'NOTICE'}
          excluded_parts = {'.git', 'node_modules', 'dist', 'build', 'coverage', '.venv', 'venv'}

          keep_api = '__BOASTED_KEEP_API_HOST__'
          keep_legal = '__BOASTED_KEEP_LEGAL_ENTITY__'

          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or any(part in excluded_parts for part in path.parts):
                  continue
              if path.suffix.lower() not in text_exts and path.name not in exact_names:
                  continue
              try:
                  raw = path.read_bytes()
              except OSError:
                  continue
              if b'\x00' in raw:
                  continue
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  continue

              original = text

              # Keep infrastructure identifiers/endpoints stable during the public rebrand.
              text = text.replace('api.usebragstack.com', keep_api)
              # Do not invent a legal-entity rename. Product brand and LLC name are separate changes.
              text = text.replace('BragStack LLC', keep_legal)

              # Standalone product-name references only. This intentionally does not rename
              # identifiers such as BragStackLoader, BRAGSTACK_API_TARGET, or asset filenames.
              text = re.sub(r'(?<![A-Za-z0-9_])BragStack(?![A-Za-z0-9_])', 'Boasted', text)
              text = re.sub(r'(?<![A-Za-z0-9_])BRAGSTACK(?![A-Za-z0-9_])', 'BOASTED', text)

              # Customer-facing web/email domains.
              text = text.replace('usebragstack.com', 'boasted.io')
              text = text.replace('bragstack.app', 'boasted.io')

              text = text.replace(keep_api, 'api.usebragstack.com')
              text = text.replace(keep_legal, 'BragStack LLC')

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} files')
          for item in changed:
              print(item)

          # Guardrails for the requested customer-facing domain migration.
          leftovers = []
          for path in root.rglob('*'):
              if not path.is_file() or any(part in excluded_parts for part in path.parts):
                  continue
              if path.suffix.lower() not in text_exts and path.name not in exact_names:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (OSError, UnicodeDecodeError):
                  continue
              scrubbed = text.replace('api.usebragstack.com', '')
              if 'usebragstack.com' in scrubbed or 'bragstack.app' in scrubbed:
                  leftovers.append(str(path))

          if leftovers:
              raise SystemExit('Legacy customer domains remain in: ' + ', '.join(leftovers))
          PY

      - name: Commit rebrand and remove one-time workflow
        shell: bash
        run: |
          git rm --ignore-unmatch .github/workflows/rebrand-boasted.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No rebrand changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebrand customer-facing product to Boasted [boasted-rebrand]"
          git push origin HEAD:rebrand/boasted-io
