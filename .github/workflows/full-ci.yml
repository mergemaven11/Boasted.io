name: Full Release and Nightly CI

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types:
      - published

concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend-full:
    name: Full backend suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      MONGO_URL: mongodb://localhost:27017
      JWT_SECRET: test-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run full backend test suite
        run: python -m pytest

  frontend-full:
    name: Full browser and production frontend suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fast frontend tests
        run: |
          npm run test:analytics
          node scripts/verify-aisha-source.mjs
          npm run test:interview
          npm run test:resume
          npm run test:seo

      - name: Audit every visible click path in real Chrome
        run: npm run test:clicks

      - name: Confirm responsive UI on phone, tablet, and desktop
        run: npm run test:layout

      - name: Upload responsive UI failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-ui-failures
          path: frontend/artifacts/ui-layout
          if-no-files-found: ignore
          retention-days: 3

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Enforce production bundle budgets
        run: npm run test:bundle

      - name: Verify Aisha production bundle
        run: node scripts/verify-aisha-build.mjs

  dependency-audit:
    name: Full dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            set +e
            audit_output="$(npm audit --audit-level=high 2>&1)"
            audit_status=$?
            set -e
            printf '%s\n' "$audit_output"
            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi
            if printf '%s\n' "$audit_output" | grep -Eq '503 Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
              if [ "$attempt" -lt 3 ]; then
                echo "npm audit service unavailable; retrying transient registry failure ($attempt/3)."
                sleep 10
                continue
              fi
            fi
            exit "$audit_status"
          done
          exit 1
