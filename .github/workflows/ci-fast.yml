name: CI Fast

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Area to validate"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - backend
          - frontend

concurrency:
  group: ci-fast-${{ github.ref }}-${{ inputs.scope }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-fast:
    name: Fast backend checks
    if: inputs.scope == 'all' || inputs.scope == 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app
      - name: Run safety-critical deterministic tests
        run: |
          python -m pytest -q \
            tests/test_ai_evaluation.py \
            tests/test_ai_foundation.py \
            tests/test_resume_quality.py \
            tests/test_verified_resume_route_order.py \
            tests/test_oauth_routes.py

  frontend-fast:
    name: Fast frontend checks
    if: inputs.scope == 'all' || inputs.scope == 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Resume, interview, and confidentiality safety checks
        run: |
          npm run test:resume
          npm run test:interview
          npm run test:safety
      - name: Lint
        run: npm run lint
