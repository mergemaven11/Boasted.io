name: CI Fast

on:
  push:
    branches-ignore:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci-*.yml"
      - "docs/CI_BUDGET_POLICY.md"

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            changed_files="$(git diff --name-only HEAD^ HEAD)"
          else
            changed_files="$(git show --pretty='' --name-only HEAD)"
          fi
          printf '%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -Eq '^(backend/|\.github/workflows/ci-)'; then echo "backend=true" >> "$GITHUB_OUTPUT"; else echo "backend=false" >> "$GITHUB_OUTPUT"; fi
          if printf '%s\n' "$changed_files" | grep -Eq '^(frontend/|\.github/workflows/ci-)'; then echo "frontend=true" >> "$GITHUB_OUTPUT"; else echo "frontend=false" >> "$GITHUB_OUTPUT"; fi

  backend-fast:
    name: Fast backend checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app
      - name: Run safety-critical deterministic tests
        run: |
          python -m pytest -q \
            tests/test_ai_evaluation.py \
            tests/test_ai_foundation.py \
            tests/test_resume_quality.py \
            tests/test_verified_resume_route_order.py \
            tests/test_oauth_routes.py

  frontend-fast:
    name: Fast frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Resume, interview, and confidentiality safety checks
        run: |
          npm run test:resume
          npm run test:interview
          npm run test:safety
      - name: Lint
        run: npm run lint
