name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan tracked files and reachable history
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch repository branch refs for history scan
        run: git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Scan for committed credentials
        run: python scripts/scan-secrets.py --history
