name: CI PR

# Protected-branch contexts are intentionally defined here; changing this
# workflow triggers the full backend, frontend, and dependency validation set.

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/ci-*.yml"
      - "docs/CI_BUDGET_POLICY.md"

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect PR changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -Eq '^(backend/|\.github/workflows/ci-)'; then echo "backend=true" >> "$GITHUB_OUTPUT"; else echo "backend=false" >> "$GITHUB_OUTPUT"; fi
          if printf '%s\n' "$changed_files" | grep -Eq '^(frontend/|\.github/workflows/ci-)'; then echo "frontend=true" >> "$GITHUB_OUTPUT"; else echo "frontend=false" >> "$GITHUB_OUTPUT"; fi
          if printf '%s\n' "$changed_files" | grep -Eq '^(backend/requirements\.txt|frontend/package\.json|frontend/package-lock\.json|\.github/workflows/ci-)'; then echo "dependencies=true" >> "$GITHUB_OUTPUT"; else echo "dependencies=false" >> "$GITHUB_OUTPUT"; fi

  backend-medium:
    # Preserve the protected-branch context while using the cheaper medium PR tier.
    name: Run backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://localhost:27017
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend regression suite
        run: python -m pytest

  frontend-medium:
    # Preserve the protected-branch context while using the cheaper medium PR tier.
    name: Test, lint and build frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic frontend checks
        run: |
          npm run test:analytics
          node scripts/verify-aisha-source.mjs
          npm run test:interview
          npm run test:resume
          npm run test:safety
          npm run test:seo
          npm run test:settings
          npm run test:layout
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  dependency-audit:
    # This context is required by the protected branch, so keep the job itself
    # merge-safe on every PR. Expensive dependency audits only run when dependency
    # manifests or CI workflow definitions changed.
    name: Dependency vulnerability audit
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: No dependency changes
        if: needs.changes.outputs.dependencies != 'true'
        run: echo "No dependency manifests changed; required audit context satisfied."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.dependencies == 'true'
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.dependencies == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Audit Python dependencies
        if: needs.changes.outputs.dependencies == 'true'
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1325
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.dependencies == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend dependencies
        if: needs.changes.outputs.dependencies == 'true'
        working-directory: frontend
        run: |
          npm ci
          for attempt in 1 2 3; do
            set +e
            audit_output="$(npm audit --audit-level=high 2>&1)"
            audit_status=$?
            set -e
            printf '%s\n' "$audit_output"
            if [ "$audit_status" -eq 0 ]; then exit 0; fi
            if printf '%s\n' "$audit_output" | grep -Eq '503 Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN' && [ "$attempt" -lt 3 ]; then sleep 10; continue; fi
            exit "$audit_status"
          done
