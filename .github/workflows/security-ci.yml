name: Security CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          # PYSEC-2026-1325 is a transitive ecdsa advisory from python-jose.
          # pip-audit reports no fixed ecdsa release yet, so keep the exception
          # narrow and explicit while continuing to fail on every fixable finding.
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Apply non-breaking frontend security fixes
        if: github.event_name == 'pull_request'
        working-directory: frontend
        run: npm audit fix --package-lock-only

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Commit repaired lockfile and restore workflow
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/security-ci.yml
          if git diff --quiet -- frontend/package-lock.json .github/workflows/security-ci.yml; then
            echo "No lockfile repair required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json .github/workflows/security-ci.yml
          git commit -m "fix: refresh frontend lockfile after security audit"
          git push origin "HEAD:${HEAD_REF}"
