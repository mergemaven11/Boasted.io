name: Security CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          # PYSEC-2026-1325 is a transitive ecdsa advisory from python-jose.
          # pip-audit reports no fixed ecdsa release yet, so keep the exception
          # narrow and explicit while continuing to fail on every fixable finding.
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
