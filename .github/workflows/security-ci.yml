name: Security CI

on:
  pull_request:
    paths:
      - "backend/requirements.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/security-ci.yml"
      - ".github/workflows/full-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/requirements.txt"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/security-ci.yml"
      - ".github/workflows/full-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          # PYSEC-2026-1325 is a transitive ecdsa advisory from python-jose.
          # pip-audit reports no fixed ecdsa release yet, so keep the exception
          # narrow and explicit while continuing to fail on every fixable finding.
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            set +e
            audit_output="$(npm audit --audit-level=high 2>&1)"
            audit_status=$?
            set -e

            printf '%s\n' "$audit_output"
            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi

            if printf '%s\n' "$audit_output" | grep -Eq '503 Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
              if [ "$attempt" -lt 3 ]; then
                echo "npm audit service unavailable; retrying transient registry failure ($attempt/3)."
                sleep 10
                continue
              fi
            fi

            exit "$audit_status"
          done

          exit 1
