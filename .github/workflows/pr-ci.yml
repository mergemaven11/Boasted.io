name: PR CI

on:
  pull_request:

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://localhost:27017
      JWT_SECRET: test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend regression suite
        run: python -m pytest

  frontend-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Test analytics and UTM attribution
        run: npm run test:analytics
      - name: Verify Aisha source behavior
        run: node scripts/verify-aisha-source.mjs
      - name: Test interview intelligence engine
        run: npm run test:interview
      - name: Test structured resume helpers
        run: npm run test:resume
      - name: Verify search appearance and sitelink signals
        run: npm run test:seo
      - name: Lint frontend
        run: npm run lint
      - name: Build production frontend
        run: npm run build
      - name: Enforce production bundle budgets
        run: npm run test:bundle
      - name: Verify Aisha production bundle
        run: node scripts/verify-aisha-build.mjs
