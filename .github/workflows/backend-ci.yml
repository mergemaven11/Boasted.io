name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/full-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-backend:
    name: Fast backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    env:
      JWT_SECRET: test-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q app

      - name: Run fast deterministic and resume safety tests
        run: |
          python -m pytest -q \
            tests/test_ai_evaluation.py \
            tests/test_ai_foundation.py \
            tests/test_ai_verification_dashboard.py \
            tests/test_career_intelligence.py \
            tests/test_resume_builder.py \
            tests/test_resume_import_formatting.py \
            tests/test_resume_import_parser.py \
            tests/test_resume_parser_lazy_imports.py \
            tests/test_resume_quality.py \
            tests/test_resume_scan_regressions.py \
            tests/test_resume_structured_save.py \
            tests/test_verified_resume_route_order.py
