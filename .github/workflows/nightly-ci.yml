name: Nightly CI

on:
  schedule:
    - cron: "30 6 * * *"

concurrency:
  group: nightly-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  activity:
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.changed.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changed
        name: Skip heavy work when main has been quiet
        run: |
          last_commit="$(git log -1 --format=%ct)"
          now="$(date +%s)"
          if [ $((now - last_commit)) -le 90000 ]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_heavy=false" >> "$GITHUB_OUTPUT"
          fi

  deep-validation:
    needs: activity
    if: needs.activity.outputs.run_heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2026-1325

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-fund
      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            set +e
            audit_output="$(npm audit --audit-level=high 2>&1)"
            audit_status=$?
            set -e
            printf '%s\n' "$audit_output"
            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi
            if printf '%s\n' "$audit_output" | grep -Eq '503 Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
              if [ "$attempt" -lt 3 ]; then
                sleep 10
                continue
              fi
            fi
            exit "$audit_status"
          done
          exit 1
      - name: Audit every visible click path in real Chrome
        working-directory: frontend
        run: npm run test:clicks
      - name: Confirm responsive UI on phone, tablet, and desktop
        working-directory: frontend
        run: npm run test:layout
      - name: Upload browser QA failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bragstack-nightly-browser-failures
          path: frontend/artifacts/ui-layout
          if-no-files-found: ignore
          retention-days: 3
