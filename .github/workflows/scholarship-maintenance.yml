name: Scholarship Catalog Maintenance

on:
  schedule:
    # Daily expiration cleanup at 07:17 UTC.
    - cron: "17 7 * * *"
    # Weekly licensed-source refresh on Sundays at 07:47 UTC.
    - cron: "47 7 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Maintenance operation to run"
        required: true
        default: "sync"
        type: choice
        options:
          - sync
          - expire

permissions:
  contents: read

concurrency:
  group: scholarship-maintenance-${{ github.event.schedule || inputs.mode || 'manual' }}
  cancel-in-progress: false

jobs:
  expire:
    name: Expire closed scholarship cycles
    if: github.event.schedule == '17 7 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'expire')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: ${{ secrets.MONGO_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Require production database secret
        run: |
          if [ -z "$MONGO_URL" ]; then
            echo "::error::Repository Actions secret MONGO_URL is required for scholarship maintenance."
            exit 1
          fi
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Soft-expire passed scholarship deadlines
        run: python scripts/expire_scholarships.py

  sync:
    name: Refresh licensed scholarship catalog
    if: github.event.schedule == '47 7 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'sync')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: ${{ secrets.MONGO_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Require production database secret
        run: |
          if [ -z "$MONGO_URL" ]; then
            echo "::error::Repository Actions secret MONGO_URL is required for scholarship maintenance."
            exit 1
          fi
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh only the approved licensed scholarship source
        run: python scripts/sync_scholarships.py
