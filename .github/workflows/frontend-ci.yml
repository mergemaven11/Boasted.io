name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/workflows/full-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-frontend:
    name: Fast frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 12

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test analytics events and UTM attribution
        run: npm run test:analytics

      - name: Verify Aisha source
        run: node scripts/verify-aisha-source.mjs

      - name: Test interview intelligence engine
        run: npm run test:interview

      - name: Test structured resume helpers
        run: npm run test:resume

      - name: Verify search appearance and sitelink signals
        run: npm run test:seo

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
